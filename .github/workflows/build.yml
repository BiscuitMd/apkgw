name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_VERSION: '17'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project root
        id: detect
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "root=." >> $GITHUB_OUTPUT
          elif [ -f "android/settings.gradle.kts" ] || [ -f "android/settings.gradle" ]; then
            echo "root=android" >> $GITHUB_OUTPUT
          else
            echo "Tidak menemukan settings.gradle(.kts) di root atau android/"
            find . -name "settings.gradle*" -not -path "*/node_modules/*" || true
            exit 1
          fi
          echo "Project root detected"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK (manual, no action)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          SDKMGR=""
          for path in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -f "$path" ]; then
              SDKMGR="$path"
              break
            fi
          done

          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager tidak ditemukan, install manual"
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget unzip
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | ${{ env.SDKMGR }} --licenses > /dev/null 2>&1 || true
          echo "Licenses accepted"

      - name: Install required SDK packages
        run: |
          ${{ env.SDKMGR }} --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            > /dev/null 2>&1 || true
          echo "SDK packages installed"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.detect.outputs.root }}
        run: chmod +x gradlew || true

      - name: Setup Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew tidak ada, generate ulang..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x gradlew
          else
            echo "gradlew sudah ada"
          fi
          ls -la gradlew

      - name: Fix filenames (rename typo kalau ada)
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          if [ -f "build.grande.kts" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Renaming build.grande.kts to build.gradle.kts"
            mv "build.grande.kts" "build.gradle.kts"
          fi
          if [ -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Renaming settings.gradle to settings.gradle.kts"
            mv "settings.gradle" "settings.gradle.kts"
          fi
          echo "Files in root:"
          ls -la

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        id: verify
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "APK tidak ditemukan di $APK_FILE"
            find . -name "*.apk" || true
            exit 1
          fi
          ls -la "$APK_FILE"
          SIZE=$(du -h "$APK_FILE" | cut -f1)
          echo "APK size: $SIZE"
          echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
          echo "APK verified"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: system-update-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs (kalau gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
          retention-days: 7
          if-no-files-found: ignore
