name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_VERSION: '17'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project root
        id: detect
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "root=." >> $GITHUB_OUTPUT
          elif [ -f "android/settings.gradle.kts" ] || [ -f "android/settings.gradle" ]; then
            echo "root=android" >> $GITHUB_OUTPUT
          else
            echo "❌ Tidak menemukan settings.gradle(.kts) di root atau android/"
            find . -name "settings.gradle*" -not -path "*/node_modules/*" || true
            exit 1
          fi
          echo "Project root: $(cat $GITHUB_OUTPUT | grep root | cut -d= -f2)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK (manual, no action)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          echo "=== SDK structure ==="
          ls -la $ANDROID_SDK_ROOT/ || true
          ls -la $ANDROID_SDK_ROOT/cmdline-tools/ || true

          # Cari sdkmanager di berbagai lokasi
          SDKMGR=""
          for path in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -f "$path" ]; then
              SDKMGR="$path"
              break
            fi
          done

          if [ -z "$SDKMGR" ]; then
            echo "❌ sdkmanager tidak ditemukan, coba install ulang via apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget unzip
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | ${{ env.SDKMGR }} --licenses > /dev/null 2>&1 || true
          echo "✅ Licenses accepted"

      - name: Install required SDK packages
        run: |
          ${{ env.SDKMGR }} --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            > /dev/null 2>&1 || true
          echo "✅ SDK packages installed"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.detect.outputs.root }}
        run: chmod +x gradlew || true

      - name: Setup Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew tidak ada, generate ulang..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
            chmod +x gradlew
          else
            echo "✅ gradlew sudah ada"
          fi
          ls -la gradlew

      - name: Fix filenames (rename typo kalau ada)
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          # Fix typo umum
          for typo in "build.grande.kts:build.gradle.kts" "settings.gradle:settings.gradle.kts"; do
            from=$(echo $typo | cut -d: -f1)
            to=$(echo $typo | cut -d: -f2)
            if [ -f "$from" ] && [ ! -f "$to" ]; then
              echo "Renaming $from → $to"
              mv "$from" "$to"
            fi
          done
          echo "=== Files in root ==="
          ls -la

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/outputs/apk/*" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan"
            find . -name "*.apk" || true
            exit 1
          fi
          echo "APK found: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: system-update-apk
          path: ${{ steps.detect.outputs.root }}/${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Upload build logs (kalau gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ steps.detect.outputs.root }}/app/build/reports/
            ${{ steps.detect.outputs.root }}/build/reports/
          retention-days: 7
          if-no-files-found: ignore
